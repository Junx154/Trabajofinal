<article class="container">
        <form action="" class="formulario">
        <section class="row">
            <section class="col-xs-12 col-sm-6 col-md-6">
                <img src="img/ICONOCONTACTOS.png" alt="" class="img-fluid">
            </section>
            <section class="col-xs-12 col-sm-6 col-md-6">
                <label>Nombre y Apellido: </label>
                <input type="text" placeholder="Ingrese sus nombre completo">

                <label>Edad: </label>
                <input type="number" min="1" max="100" placeholder="Ingrese su edad">

                <label>Telefono: </label>
                <input type="tel" placeholder="Ingrese su celular">
                
                <label>Tipo de mascota: </label>
                <input type="text" list="opciones-mascota" id="mascota" name="mascota" placeholder="Seleccione su mascota">
                <datalist id="opciones-mascota">
                  <option value="Perro"></option>
                  <option value="Gato"></option>
                  <option value="Hamster"></option>
                  <option value="Ave"></option>
                  <option value="Conejo">

                </datalist>

                <label>Fecha de cita </label>
                <input type="datetime-local" placeholder="Ingrese sus apellidos">

                <input type="submit" class="boton">

            </section>
        </section>
        </form>
    </article>

    <!-- JAVASCRIPT DE BOOSTRAP -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
